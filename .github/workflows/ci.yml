name: OmniDesk AI — Production CI/CD Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Monorepo Typecheck, Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: 1. Generate Prisma Client
        run: npm --workspace=@omnidesk/api run prisma:generate

      - name: 2. Typecheck All Packages & Apps
        run: npm run typecheck

      - name: 3. Production Build Verification
        run: npm run build

      - name: 4. Automated Test Suites
        run: npm test

      - name: 5. Security & Secret Leak Prevention
        run: |
          echo "::group::Security & Untracked Secret Auditing"
          if git ls-files | grep -E '^(\.env(\..+)?|.*\.pem|.*\.key|.*\.pfx|id_rsa.*)$' | grep -v '\.env\.example'; then
            echo "::error::Sensitive credential or environment files found tracked in git!"
            exit 1
          fi
          echo "No sensitive credential files tracked."
          echo "::endgroup::"
